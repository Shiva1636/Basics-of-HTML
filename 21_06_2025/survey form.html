<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1 id="title">Survey Form</h1>
    <p id="description">
        This Form Is About The Details Of The Familes
    </p>
    <form id="survey-form">
        <label id="name-label">Enter Your Name: </label>
        <input type="text" id="name" placeholder="Enter Your Name"><br><br>
        <label id="email-label">Enter Your Email: </label>
        <input type="email" id="email" placeholder="Enter Your Email"><br><br>
        <label id="number-label">Enter Your Number: </label>
        <input type="number" id="number" placeholder="Enter Your Number" max="10" min="10"><br><br>
        <label>Select Your Country:</label>
        <select id="dropdown">
            <option disabled selected>Select your country</option>
            <option>India</option>
            <option>USA</option>
            <option>Australia</option>
        </select><br><br>

        <input type="radio" name="gender" value="male" id="male" required />
        <label for="male">male</label>
        <input type="radio" name="gender" value="female" id="female" required />
        <label for="female">female</label><br><br>
        <input type="checkbox" value="Branch"> DS
        <input type="checkbox" value="Branch"> CSE
        <input type="checkbox" value="Branch"> AIML
        <input type="checkbox" value="Branch"> IT
        <br><br>
        <label>Enter Additional Information:</label><br>
        <textarea placeholder="Enter A Description"></textarea><br><br>
        <center>
            <button type="submit" id="submit">Submit>
        </center>
    </form>
</body>

</html>
