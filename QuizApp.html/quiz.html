<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz App</title>
  <link rel="stylesheet" href="quiz.css" />
</head>
<body>
  <div class="quiz-container">
    <div id="questionBox">
      <div class="timer" id="timer">Time: 10</div>
      <div class="question" id="question">Loading...</div>
      <div class="options" id="options"></div>
      <button onclick="nextQuestion()" id="nextBtn">Next</button>
      <button onclick="showResults()" id="showResultBtn" style="display:none;">Show Result</button>
    </div>
    <div id="resultBox" class="hidden">
      <h2>Your Score: <span id="score"></span>/15</h2>
      <div class="stars" id="stars"></div>
      <h3>Top 5 Scores:</h3>
      <ul id="leaderboard"></ul><br><br>
      <a href="index.html" class="main-btn">Back to Home</a>
    </div>
  </div>
  <script src="quiz.js"></script>
</body>
</html>
