<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex For DoubleClick</title>
</head>

<body>
    <div id="abc" style="width: 100px; height: 100px; background-color: lightblue;"></div>
    <br><br>
    <p id="para">Hello Aditya!</p>
    <button id="clickMe">Click Me</button>

    <script>
        let a = document.getElementById("abc");
        a.addEventListener("dblclick", function () {
            a.style.backgroundColor = "lightcoral";
            a.innerHTML = "Double Clicked!";
            a.style.backgroundColor === "lightcoral" ? "blue" : "green";
        });

        document.getElementById("clickMe").addEventListener("dblclick", function () {
            alert("Button is clicked");

        });
    </script>
</body>

</html>
