<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset In HTML</title>
</head>

<body>
    <h1>Reset Form Example</h1>
    <p>
        This is the information about the reset Button And How to use it
    </p>
    <form id="myform">
        <input type="text" id="textInput" placeholder="Type Here Your Name...">
        <button type="reset">Reset</button>
    </form>

    <script>
        let form = document.getElementById("myform");
        let input = document.getElementById("textInput");
        form.addEventListener("reset", function () {
            input.value = "";
        });
    </script>
</body>

</html>
