                name: "Cotton T-shirt's",
                price: 200,
                img: "https://mir-s3-cdn-cf.behance.net/project_modules/1400/40b96526388505.56354b599cc44.jpg"
            },
        ];

        // Render products
        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            products.forEach((prod, idx) => {
                list.innerHTML += `
                    <div class="product" data-index="${idx}">
                        <img src="${prod.img}" alt="${prod.name}">
                        <center>
                            <h3>${prod.name}</h3>
                            <div>Min 35% off</div>
                            <div class="price">₹${prod.price}</div>
                            <div class="btns">
                                <button class="buy-btn">Buy Now</button>
                                <button class="add-cart-btn">Add to Cart</button>
                            </div>
                        </center>
                    </div>
                `;
            });
        }

        // Add to Cart logic
        function addToCart(idx) {
            const cart = JSON.parse(localStorage.getItem('cart') || "[]");
            cart.push(products[idx]);
            localStorage.setItem('cart', JSON.stringify(cart));
            alert(products[idx].name + " added to cart!");
        }

        // Event delegation for buttons
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            document.getElementById('product-list').addEventListener('click', function (e) {
                if (e.target.classList.contains('add-cart-btn')) {
                    const idx = e.target.closest('.product').dataset.index;
                    addToCart(idx);
                } else if (e.target.classList.contains('buy-btn')) {
                    const idx = e.target.closest('.product').dataset.index;
                    alert("This is a demo. Buy Now clicked for " + products[idx].name);
                }
            });
        });
    </script>
